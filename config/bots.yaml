# 机器人配置文件
# 每个机器人可以配置不同的功能集和微信参数
bots:
  test:
    name: "测试机器人"
    wechat_token: "test_token_xxx"
    wechat_encoding_aes_key: "test_aes_key_xxx"
    wechat_corp_id: "wwxxx"
    wechat_corp_secret: "secret_xxx"
    wechat_agent_id: 1000001
    enabled: true
    # 功能列表：此机器人只开放3个功能
    features: 
      - accounting
      - essay
      - tarot
    
  prod:
    name: "生产机器人"
    wechat_token: "prod_token_xxx"
    wechat_encoding_aes_key: "prod_aes_key_xxx"
    wechat_corp_id: "wwyyy"
    wechat_corp_secret: "secret_yyy"
    wechat_agent_id: 1000002
    enabled: true
    # 功能列表：此机器人开放全部功能
    features:
      - accounting
      - essay
      - employee
      - tarot
    
  hr:
    name: "HR机器人"
    wechat_token: "hr_token_xxx"
    wechat_encoding_aes_key: "hr_aes_key_xxx"
    wechat_corp_id: "wwzzz"
    wechat_corp_secret: "secret_zzz"
    wechat_agent_id: 1000003
    enabled: true
    # 功能列表：此机器人只开放员工管理
    features:
      - employee

